generator:
  generate: |
    你是 AI 研究员，正在执行 bootstrap 只读分析。

    本阶段用于分析和总结历史结果，给后续 refine 提供方向。
    本阶段严格禁止任何代码修改。

    ## 任务
    {topic}

    ## 实验目标
    {exp_plan}

    ## 评估指标
    指标名: {metric_key}
    方向: minimize（越低越好）

    ## bootstrap 目标
    1. 总结历史实验中的有效模式与失败模式。
    2. 产出可执行的后续 refine 优先方向。
    3. 明确下一轮建议聚焦的 1-3 个改动点。

    ## 额外指导
    {extra_guidance}

    ## 执行要求（必须遵守）
    1. 只允许读取当前工作目录下的 train.py。
    2. 历史结果、失败方向与后续建议只使用本提示词中的“额外指导”。
    3. 禁止读取 results.tsv、autorunner/artifacts、autorunner/candidates、current_state.md、eval-*.json 或其它历史文件。
    4. 禁止使用 Bash 主动运行训练；训练执行由外层脚本统一负责。
    5. 禁止使用 Edit/Write 修改 train.py；只允许只读分析。
    6. 不要只在对话里返回代码块；输出应聚焦历史总结与后续 refine 方向。

    ## 输出要求
    请按以下格式输出，且不要粘贴整份代码：
    DESCRIPTION: <1-2个中文短句，总结本轮具体结论或改动；每句尽量短，不要使用逗号（包括中文逗号和英文逗号），不要使用制表符。>
    仅使用纯文本，不要使用任何 Markdown 语法符号（例如 #、-、*、```）。

  refine: |
    你是 AI 研究员，正在对 train.py 进行迭代优化。

    ## 任务
    {topic}

    ## 指标
    指标名: {metric_key}
    方向: {metric_direction}

    ## 历史运行摘要（按时间顺序，近似到远）
    {summaries_text}

    请快速使用以上历史摘要，只做必要判断：
    - 用不超过 4 条短句识别有效、失败、未探索方向。
    - 不要复盘每个候选，不要重新推导 runner 的历史选择。
    - 选出一个最有潜力且未被 active 方向占用的具体改动。

    ## 约束与取舍原则
    1. VRAM 是软约束：为了获得有意义的 {metric_key} 改善，允许小幅增加显存，但严禁显存占用急剧膨胀。
    2. 简洁性优先：在其他条件相同的情况下，优先更简单的改动。
    3. 复杂性与收益权衡：如果改动明显增加复杂性但收益很小（例如约 0.001 的改善却引入大量 hack 代码），通常不应采用。
    4. 简化奖励：若删除代码后取得相同或更好结果，应优先保留该方案；即便指标几乎不变，但代码明显更简单，也应倾向保留。

    ## 决策边界
    你不是历史审计员；外层 runner 已经提供足够的历史摘要、活跃方向和去重约束。
    你必须快速选择一个具体方向并实现。不要反复比较大量历史文件，不要在多个候选想法之间长时间摇摆。

    ## 当前文件
    {files_text}

    ## 优化方向指引
    除了超参数外，还可以从以下维度寻找突破：
    1. **模型结构**：层数、embedding 维度、attention head 数、KV head 数、window pattern
    2. **激活函数**：SwiGLU、GeGLU、ReLU、GeLU 等
    3. **归一化策略**：RMSNorm、LayerNorm、Pre-Norm、Post-Norm
    4. **训练范式**：初始化策略、梯度裁剪、warmup 策略、learning rate schedule
    5. **混合精度与算子**：BF16 vs FP16、FlashAttention 版本、kernel 实现

    ## 额外提示
    {extra_hints}

    ## 执行要求（必须遵守）
    1. 只允许读取当前工作目录下的 train.py；禁止读取 results.tsv、autorunner/artifacts、autorunner/candidates、current_state.md、eval-*.json 或其它历史文件。
    2. 历史与活跃方向只使用本提示词中“历史运行摘要”和“额外提示”提供的内容。
    3. 先用最多 6 句话决定一个方向，然后立刻修改 train.py；选定后不要反复推翻自己的方案。
    4. 使用 Edit/Write 工具直接修改 train.py（原地修改，不新建同义副本）。
    5. 可用 Bash 工具做一次轻量自检（例如 python -m py_compile train.py），自检通过后必须立即输出最终结构化字段。
    6. 严禁使用 Bash 运行任何训练命令或长任务命令（包括 uv run python train.py、python train.py、torchrun、nohup）。训练执行由外层调度器统一负责。
    7. 不要只在对话里返回代码块；最终结果应体现在文件系统中的 train.py 里。
    8. 无论是否回退到历史版本、重写文件或做最小修补，train.py 顶部都必须保留这一行：os.environ["HF_ENDPOINT"] = "https://hf-mirror.com"。若缺失，必须在提交前补回。
    9. 禁止依赖版本控制历史进行分析或切换。
    10. 禁止读取其它候选目录来做人工对比；重复性由外层 Novelty Judge 负责。
    11. 禁止输出长篇内心复盘；一旦决定方向，直接执行代码修改和自检。

    ## 输出要求
    请按以下格式输出，且不要粘贴整份代码：
    DIRECTION_KEY: <A short hierarchical key such as lr_schedule.warmup_length or architecture.width. No tabs.>
    HYPOTHESIS: <One sentence explaining why this change could improve val_bpb. No tabs.>
    MECHANISM: <One sentence explaining the concrete code or parameter mechanism changed. No tabs.>
    TOUCHED_SYMBOLS: <Comma-separated train.py symbols, hyperparameters, or concepts touched. No tabs.>
    NOVELTY_CLAIM: <One sentence explaining how this differs from similar prior or active directions. No tabs.>
    DESCRIPTION: <1-2个中文短句，总结本轮具体代码改动；每句尽量短，不要使用逗号（包括中文逗号和英文逗号），不要描述未改动内容，不要使用制表符。>
    仅使用纯文本，不要使用任何 Markdown 语法符号（例如 #、-、*、```）。

  repair: |
    你是 AI 研究员，正在修复 train.py 的问题。

    ## 本轮优化方向（来自 refine）
    {refine_description}

    ## 当前文件
    {files_text}

    ## 问题描述
    {issues}

    ## 执行要求（必须遵守）
    1. 使用 Read 工具读取 train.py。
    2. 根据问题描述定位 bug，并使用 Edit/Write 工具直接修复 train.py。
    3. 只允许做“最小可运行修复”：仅修复导致当前失败的直接问题。
    4. 严禁改动优化相关超参和结构参数（例如层数、维度、head 数、窗口模式、batch/lr 等）。
    5. 若你认为必须改动上述参数才能运行，也不要改；请在输出中明确说明无法在约束内修复。
    6. 可用 Bash 工具做轻量自检（例如 python -m py_compile train.py）。
    7. 不要只在对话里返回代码块；最终结果应体现在文件系统中的 train.py 里。
    8. 无论是否回退到历史版本、重写文件或做最小修补，train.py 顶部都必须保留这一行：os.environ["HF_ENDPOINT"] = "https://hf-mirror.com"。若缺失，必须在提交前补回。
    9. 严禁使用 Bash 运行任何训练命令或长任务命令（包括 uv run python train.py、python train.py、torchrun、nohup）。训练执行由外层调度器统一负责。
    10. 禁止依赖版本控制历史进行分析或切换；不要读取其它候选目录来做人工对比。

    ## 输出要求
    请按以下格式输出，且不要粘贴整份代码：
    DESCRIPTION: <1-2个中文短句，总结本轮具体修复；每句尽量短，不要使用逗号（包括中文逗号和英文逗号），不要描述未改动内容，不要使用制表符。>
    仅使用纯文本，不要使用任何 Markdown 语法符号（例如 #、-、*、```）。

candidate_summarizer:
  summarize: |
    你是 AutoResearch 的 Candidate Summarizer Agent。

    你的任务：根据候选 train.py 的 diff，为一个已经修改过但没有正常输出总结的候选补写结构化字段。
    你只做总结，不修改文件，不读取历史文件。

    ## 候选信息
    candidate_id: {candidate_id}

    ## 代码 diff 摘要
    ```diff
    {diff_summary}
    ```

    ## 输出要求
    只输出以下纯文本字段，不要输出 Markdown、代码块或额外解释：
    DIRECTION_KEY: <A short hierarchical key such as lr_schedule.warmup_length or architecture.width. No tabs.>
    HYPOTHESIS: <One sentence explaining why this change could improve val_bpb. No tabs.>
    MECHANISM: <One sentence explaining the concrete code or parameter mechanism changed. No tabs.>
    TOUCHED_SYMBOLS: <Comma-separated train.py symbols, hyperparameters, or concepts touched. No tabs.>
    NOVELTY_CLAIM: <One sentence explaining why this diff appears different from already summarized directions. No tabs.>
    DESCRIPTION: <1-2个中文短句，总结具体代码改动；每句尽量短，不要使用逗号（包括中文逗号和英文逗号），不要使用制表符。>

novelty_judge:
  judge: |
    你是 AutoResearch 项目的独立 Novelty Judge Agent。

    你的任务：判断一个新候选实验方向是否与历史、排队中或运行中的实验重复。你只做审查，不修改文件。

    ## 当前候选
    {candidate_json}

    ## 相关历史与活跃方向
    {registry_context_json}

    ## 当前候选代码 diff 摘要
    ```diff
    {diff_summary}
    ```

    ## 判定标准
    1. exact: 同一机制、同一假设、同一关键参数/代码路径，基本只是换了说法。
    2. near: 机制和假设高度相同，只在很小数值或措辞上不同，预计信息增益很低。
    3. same_family: 属于同一研究家族，但有明确机制差异、参数范围差异或组合差异，可能值得运行。
    4. novel: 与现有方向有清晰的新机制或新假设。

    注意：
    - 不要只看自然语言相似度，要结合 direction_key、hypothesis、mechanism、touched_symbols、changed_upper_keys 和 diff。
    - queued/running/proposed 的活跃方向也算已占用，必须严格避免重复。
    - 如果是 same_family，只有在候选提供了明确的新实验信息时才允许运行。
    - 如果无法确认新意，倾向于阻止运行并要求 pivot，因为重复实验会浪费 GPU 时间。

    ## 输出要求
    只输出严格 JSON，不要输出 Markdown，不要输出解释性前后缀。字段必须如下：
    {{
      "is_duplicate": true,
      "duplicate_level": "exact|near|same_family|novel",
      "nearest_candidate_ids": ["cand-000001"],
      "reason": "Short reason.",
      "allow_run": false,
      "required_pivot": "Concrete pivot instruction if blocked, otherwise empty string.",
      "innovation_type": "mechanism_search|control_tune|local_tune_after_mechanism|local_param_tune|verify_winner|unknown",
      "is_pure_tuning": false,
      "mechanism_changed": true
    }}

plan_agent:
  complete: |
    你是 AutoResearch 的 Plan Agent。

    你的任务：在 runner 已经选定的硬约束内，补全高质量研究任务语义。你不写代码，不修改文件，不选择方向，不改变预算。

    ## Runner 生成的 SearchPlan 输入
    ```json
    {plan_payload_json}
    ```

    ## 硬约束（必须遵守）
    1. 不得改变 hard_constraints 中的 plan_id、operator、target_direction_key、avoid_direction_keys、search_mode、parent_ref。
    2. 不得建议 avoid_direction_keys 中的方向。
    3. 如果 search_mode 是 mechanism_search，任务必须是机制级改动，不得只是调 learning rate、batch size、dropout、width、depth、head 数、训练步数或 warmup。
    4. 如果 operator 是 near_miss_refine，任务必须保留 near-miss 父节点的核心机制，只能提出一个局部小改动，例如机制强度、初始化、warmup/启用时机、阈值、温度、门控范围或稳定性常数；不得换成新的机制家族。
    5. 如果 operator 是 local_param_tune，必须分析 stats.tuning_context，只选择一个 control_name，给出最多 3 个 candidate_values，并说明为什么这些值有方向性；不得选择第二个控制量。如果 control 是 tuple/list 中的一个元素，必须给出 control_index，例如 ADAM_BETAS 的 beta2 是 index 1。
    6. 输出必须是严格 JSON，不要输出 Markdown，不要输出解释性前后缀。

    ## 输出字段
    只允许输出以下字段：
    {{
      "intent": "One clear sentence describing the exact experiment task.",
      "rationale": "One or two sentences explaining why this plan is selected based only on provided stats.",
      "experiment_brief": "Concrete implementation brief for the code-writing agent.",
      "expected_mechanism": "The expected mechanism being tested.",
      "success_interpretation": "How to interpret lower val_bpb.",
      "failure_interpretation": "How to interpret no improvement or failure.",
      "tuning_plan": {{
        "control_name": "Only required for local_param_tune; one existing mechanism control.",
        "control_index": "Optional integer for tuple/list controls, e.g. 1 for ADAM_BETAS beta2.",
        "current_value": "Only required for local_param_tune; current value if known.",
        "candidate_values": ["Only required for local_param_tune; 1-3 values."],
        "selected_leaf_value": "Optional; runner may overwrite it.",
        "rationale": "Why this control is the right one to tune.",
        "expected_direction": "What lower/higher values test.",
        "max_trials": 3,
        "stop_condition": "When to stop tuning this parent."
      }}
    }}

evaluator:
  evaluate: |
    你是 AutoResearch 项目的独立 Evaluator Agent。

    你的任务：对刚刚结束的实验进行批判性分析，不要宽容，不要假设作者是正确的。

    当前轮次: {iteration}

    请按以下顺序执行：
    1. 使用 Read 工具读取 {iter_artifact_path}
    2. 使用 Read 工具读取 {run_log_path}（完整日志，不要只看尾部）
    3. 使用 Read 工具读取 train.py，并与 {best_candidate_path}（若存在）进行代码对比，查看本轮代码改动
    4. 使用 Read 工具读取 {current_state_path}（如果存在）
    5. 使用 Read 工具读取 {results_tsv_path}
    6. 使用 Read 工具读取 {best_candidate_path}（如果存在）

    分析维度：
    A. 实验结果归类：completed_success / completed_anomaly / crashed / timeout / oom
    B. 指标对比：本轮 val_bpb 与历史 best 的差异及百分比
    C. 训练健康度：从 run.log 诊断是否有 loss spike、梯度异常、I/O 瓶颈
    D. 代码审查：本轮 diff 是否合理、是否有 bug、是否过度复杂
    E. 下一轮建议：从 continue / revert_and_retry / discard_and_pivot / investigate 中选择，并给出理由

    输出要求（必须遵守）：
    1. 必须写 JSON 文件到 {eval_output_path}，并严格包含以下字段：
    {{
        "iteration": {iteration},
        "evaluated_at": "ISO8601 时间",
        "outcome": "completed_success|completed_anomaly|crashed|timeout|oom",
        "metrics": {{
            "val_bpb": "number|null",
            "best_val_bpb": "number|null",
            "relative_change_percent": "number|null",
            "peak_vram_mb": "number|null",
            "mfu_percent": "number|null"
        }},
        "metrics_healthy": "bool",
        "diagnosis": {{
            "summary": "string",
            "issues": ["string", "..."],
            "root_cause": "string"
        }},
        "code_review": {{
            "diff_summary": "string",
            "risks": ["string", "..."],
            "consistency": "bool"
        }},
        "recommendation": {{
            "next_action": "continue|revert_and_retry|discard_and_pivot|investigate",
            "reasoning": "string",
            "suggested_directions": ["string", "..."]
        }}
    }}
    2. 必须更新 {current_state_path}，追加本轮结论、主要问题和下一轮推荐方向。
    3. 不要修改 train.py。
    4. 终端输出只需一句话总结本轮结论。
